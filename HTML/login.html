<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <section>
        <main>
            <form action="#" method="get">
                <h2 style="text-align: center;">Login</h2>
                <br>
                <label for="email">Email:</label><br>
                <input type="text" id="email" name="email" placeholder="Enter your email" minlength="3" maxlength="8" required><br><br>
                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password" placeholder="Enter your password" minlength="3" maxlength="8" required><br><br>
                <button type="submit">Submit</button>
            </form>
        </main>
    </section>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover;
            position: relative;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

    
        .box,
        .bottom-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            color: white;
            padding: 20px;
            font-weight: bold;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
            background-clip: padding-box;
        }

        .top-section {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: 20px;
        }

        #box1 {
            width: 50%;
            height: 120px;
        }
        .bottom-section {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            width: 100%;
            margin-bottom: 20px;
        }

        .bottom-box {
            flex: 1;
            height: 100px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-section">
            <div id="box1" class="box">Box1</div>
        </div>
        <div class="bottom-section">
            <div id="box2" class="bottom-box">Box2</div>
            <div id="box3" class="bottom-box">Box3</div>
            <div id="box4" class="bottom-box">Box4</div>
        </div>
    </div>
</body>
</html>
